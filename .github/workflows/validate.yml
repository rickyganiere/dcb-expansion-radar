name: Validate Radar

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate intelligence data
        run: node scripts/validate-data.mjs

      - name: Check JavaScript syntax
        run: |
          node --check public/data.js
          node --check public/signals.js
          node --check public/partners.js
          node --check public/scores.js
          node --check public/app.js
          node --check public/workspace-tools.js
          node --check public/source-watch.js
          node --check public/market-notes.js
          node --check public/followup-alerts.js
          node --check public/market-report.js
          node --check public/d1-sync.js
          node --check public/automation-health.js
          node --check public/discovery-inbox.js
          node --check public/source-manager.js
          node --check public/publisher-discovery.js
          node --check src/source-registry.js
          node --check src/publisher-discovery.js
          node --check src/access-auth.js
          node --check src/index.js
          node --check scripts/validate-d1.mjs

      - name: Validate D1 migration
        run: node scripts/validate-d1.mjs

      - name: Smoke test Worker API
        run: node scripts/smoke-worker.mjs

      - name: Smoke test Publisher Discovery
        run: node scripts/smoke-publisher-discovery.mjs

      - name: Check required static assets
        run: |
          test -f public/index.html
          test -f public/styles.css
          test -f wrangler.jsonc
          test -f migrations/0001_workspace.sql
          test -f migrations/0002_source_watch.sql
          test -f migrations/0003_discovery_inbox.sql
          test -f migrations/0004_monitored_sources.sql
          test -f migrations/0005_source_entity_tags.sql
          test -f migrations/0006_commercial_entities.sql
          test -f public/automation-health.js
          test -f public/discovery-inbox.js
          test -f public/source-manager.js
          test -f public/publisher-discovery.js
          test -f src/publisher-discovery.js
