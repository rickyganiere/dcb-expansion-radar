name: Validate Radar

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate intelligence data
        run: node scripts/validate-data.mjs

      - name: Check JavaScript syntax
        run: |
          node --check public/data.js
          node --check public/signals.js
          node --check public/partners.js
          node --check public/scores.js
          node --check public/app.js
          node --check public/workspace-tools.js
          node --check public/source-watch.js
          node --check public/market-notes.js
          node --check public/followup-alerts.js
          node --check public/market-report.js
          node --check public/d1-sync.js
          node --check src/source-registry.js
          node --check src/access-auth.js
          node --check src/index.js
          node --check scripts/validate-d1.mjs

      - name: Validate D1 migration
        run: node scripts/validate-d1.mjs

      - name: Smoke test Worker API
        run: node scripts/smoke-worker.mjs

      - name: Check required static assets
        run: |
          test -f public/index.html
          test -f public/styles.css
          test -f wrangler.jsonc
          test -f migrations/0001_workspace.sql
